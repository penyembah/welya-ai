services:
  db:
    image: postgres:17-alpine
    container_name: welya-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: welya
      POSTGRES_PASSWORD: welya
      POSTGRES_DB: welya
    ports:
      - "5433:5432"
    volumes:
      - welya-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U welya -d welya"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  welya-pgdata:
