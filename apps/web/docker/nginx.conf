server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers (CSP is left to the reverse proxy, which knows the API origin)
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;
  gzip_min_length 1024;

  location = /healthz {
    access_log off;
    return 200 "ok";
  }

  # Runtime config is rewritten on every start — never cache it
  location = /config.js {
    add_header Cache-Control "no-store" always;
  }

  # Hashed Vite assets are immutable
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # SPA fallback for react-router
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
