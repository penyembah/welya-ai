<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Welya – Logo options</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; }
    section { padding: 40px; }
    .light { background: #fff; color: oklch(0.218 0.008 223.9); }
    .dark { background: oklch(0.148 0.004 228.8); color: oklch(0.925 0.005 214.3); }
    h2 { font-weight: 500; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; opacity: .6; margin: 0 0 24px; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }
    .card { border: 1px solid currentColor; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 14px; opacity: .95; }
    .card .row { display: flex; align-items: center; gap: 16px; }
    .card img { display: block; }
    .card .name { font-size: 12px; opacity: .6; font-family: ui-monospace, monospace; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 18px; }
  </style>
</head>
<body>
  <section class="light"><h2>Light</h2><div class="grid" id="light"></div></section>
  <section class="dark"><h2>Dark</h2><div class="grid" id="dark"></div></section>
  <script>
    const files = ["w-01-solid-square","w-02-monoline","w-03-double-check","w-04-sparkle","w-05-circle","w-06-bubble","w-07-layered","w-08-geometric"];
    // Inline SVGs so currentColor picks up the section color
    for (const id of ["light", "dark"]) {
      const grid = document.getElementById(id);
      files.forEach(async (f) => {
        const svg = await (await fetch(`/logos/${f}.svg`)).text();
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="row">
            <span style="width:64px;height:64px">${svg}</span>
            <span style="width:32px;height:32px">${svg}</span>
            <span style="width:16px;height:16px">${svg}</span>
          </div>
          <div class="brand"><span style="width:28px;height:28px">${svg}</span> Welya AI</div>
          <div class="name">${f}.svg</div>`;
        card.querySelectorAll("svg").forEach((s) => { s.style.width = "100%"; s.style.height = "100%"; });
        grid.appendChild(card);
      });
    }
  </script>
</body>
</html>
